name: Deploy projects to GitHub Pages

# Assembles a multi-project site under _site/ and publishes it to GitHub Pages.
# Each project is copied into its own subfolder, so it gets a clean URL:
#   MSB-V2/  -> _site/msb-v2-audit/  -> https://sardorallaberganov.github.io/UI-Projects/msb-v2-audit/
# The repo root is NOT published as-is (it contains other code / node_modules),
# only the folders explicitly copied below are deployed.
#
# To add another project later: drop a "cp" block in the "Assemble site" step
# (and add its source folder to the `paths:` filter so pushes trigger a deploy).

on:
  push:
    branches: [main]
    paths:
      - "MSB-V2/**"
      - "pages-root/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          set -e
          mkdir -p _site

          # Root hub page (lists projects) -> served at the bare Pages URL
          cp pages-root/index.html _site/index.html

          # --- MSB-V2 UX audit -> /msb-v2-audit/ ---
          mkdir -p _site/msb-v2-audit
          cp -r MSB-V2/. _site/msb-v2-audit/

          # --- add more projects below, one block each: ---
          # mkdir -p _site/<slug>
          # cp -r <source-folder>/. _site/<slug>/

          echo "Assembled site:" && find _site -maxdepth 2 -type f | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
