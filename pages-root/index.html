<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sardor · Проекты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#16161A;--mut:#9A9AA4;--line:rgba(255,255,255,.1);--grad:linear-gradient(98deg,#F93C65 0%,#E6303A 100%)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:
  radial-gradient(120% 130% at 88% -10%,rgba(249,60,101,.30),transparent 46%),
  radial-gradient(90% 120% at 0% 0%,rgba(230,48,58,.14),transparent 50%),var(--ink);
  color:#fff;font-family:"Manrope",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:40px 22px;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:640px}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#FF9DAE;font-weight:500}
h1{font-size:clamp(28px,6vw,42px);font-weight:800;letter-spacing:-.025em;margin:12px 0 6px}
.lead{color:#C9C9D4;margin:0 0 30px;font-size:16px}
.card{display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;
  background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;
  padding:20px 22px;transition:border-color .15s,transform .15s,background .15s;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad)}
.card:hover{border-color:rgba(230,48,58,.5);transform:translateY(-2px);background:rgba(255,255,255,.06)}
.card .body{flex:1;min-width:0}
.card h2{font-size:18px;font-weight:700;margin:0 0 3px}
.card p{margin:0;color:var(--mut);font-size:13.5px;line-height:1.45}
.card .tags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-family:"JetBrains Mono",monospace;font-size:11px;color:#E8E8EF;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.arrow{font-size:22px;color:#FF9DAE;flex:0 0 auto}
footer{margin-top:34px;color:#7A7A86;font-family:"JetBrains Mono",monospace;font-size:12px}
footer a{color:#FF9DAE;text-decoration:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">UI Projects</div>
  <h1>Проекты</h1>
  <p class="lead">Опубликованные через GitHub&nbsp;Pages материалы и прототипы.</p>

  <a class="card" href="msb-v2-audit/">
    <div class="body">
      <h2>Unired Business — UX-аудит</h2>
      <p>Аудит мобильного корпоративного клиент-банка (MSB-V2): 11 модулей, 101 экран, 114 находок с решениями.</p>
      <div class="tags"><span class="tag">UX-аудит</span><span class="tag">114 находок</span><span class="tag">RU</span></div>
    </div>
    <span class="arrow" aria-hidden="true">→</span>
  </a>

  <footer>© Sardor Allaberganov · <a href="https://github.com/SardorAllaberganov/UI-Projects">GitHub</a></footer>
</div>
</body>
</html>
