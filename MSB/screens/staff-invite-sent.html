<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=430, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Unired Business · Приглашение отправлено</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  body { background: #F0F0F0; }
  .frame {
    width: 430px;
    max-width: 100%;
    margin: 0 auto;
    min-height: 100vh;
    background: #F0F0F0;
    position: relative;
    padding-bottom: 110px;
  }

  .success-block {
    text-align: center;
    padding: 32px 24px 16px;
  }
  .success-icon-lg {
    width: 80px;
    height: 80px;
    background: #16A34A;
    border-radius: 50%;
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .success-icon-lg::after {
    content: '';
    width: 32px;
    height: 18px;
    border-left: 4px solid #fff;
    border-bottom: 4px solid #fff;
    transform: rotate(-45deg);
    margin-top: -4px;
  }
  .success-title {
    font: 700 22px/1.2 'Manrope', sans-serif;
    color: #3F3F46;
    margin-bottom: 8px;
  }
  .success-sub {
    font: 400 14px/1.5 'Manrope', sans-serif;
    color: #54545B;
    max-width: 320px;
    margin: 0 auto;
  }

  .invite-card {
    background: #FFFFFF;
    border-radius: 20px;
    padding: 16px;
    margin: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .info-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 10px 14px;
    background: #F6F8F9;
    border-radius: 12px;
  }
  .info-row .lbl {
    font: 400 12px/1 'Manrope', sans-serif;
    color: #7D7D85;
  }
  .info-row .val {
    font: 600 15px/1.2 'Manrope', sans-serif;
    color: #3F3F46;
  }
  .info-row .val.muted { color: #7D7D85; font-weight: 500; }

  .link-row {
    background: #FFE5EB;
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .link-row .link-text {
    flex: 1;
    font: 600 13px/1.3 'Manrope', sans-serif;
    color: #E6303A;
    word-break: break-all;
    min-width: 0;
  }
  .link-row .copy-btn {
    background: #FFFFFF;
    border: 1px solid #FFE5EB;
    color: #E6303A;
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    font: 600 12px/1 'Manrope', sans-serif;
    flex-shrink: 0;
  }

  .footer-cta {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 430px;
    padding: 0 16px;
    z-index: 30;
    display: flex;
    gap: 8px;
  }
  .cta-btn-pink {
    flex: 1;
    background: linear-gradient(171.83deg, #F93C65 23.888%, #E6303A 85.587%);
    color: #FFFFFF;
    border: none;
    height: 56px;
    border-radius: 16px;
    font: 600 16px/1 'Manrope', sans-serif;
    cursor: pointer;
  }
  .cta-btn-outline {
    flex: 1;
    background: #FFFFFF;
    border: 1px solid #DFDFE4;
    height: 56px;
    border-radius: 16px;
    cursor: pointer;
    font: 600 14px/1 'Manrope', sans-serif;
    color: #3F3F46;
  }
</style>
</head>
<body>
<div class="frame">
  <div id="topBar"></div>

  <div class="success-block">
    <div class="success-icon-lg"></div>
    <div class="success-title">Приглашение отправлено</div>
    <div class="success-sub">Ссылка для прохождения KYC отправлена сотруднику. После завершения процесса он появится в списке кадров.</div>
  </div>

  <div class="invite-card">
    <div class="info-row">
      <div class="lbl">Сотрудник</div>
      <div class="val" id="empName"></div>
    </div>
    <div class="info-row">
      <div class="lbl">Номер телефона</div>
      <div class="val" id="empPhone"></div>
    </div>
    <div class="info-row">
      <div class="lbl">Ссылка действует до</div>
      <div class="val" id="empExpiry"></div>
    </div>
    <div class="link-row" id="linkRow">
      <div class="link-text" id="linkText"></div>
      <button class="copy-btn" id="copyBtn">Копировать</button>
    </div>
  </div>

  <div class="footer-cta">
    <button class="cta-btn-outline" onclick="preview()">Превью KYC</button>
    <button class="cta-btn-pink" onclick="location.href='staff.html'">Готово</button>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
  MSB.init();
  document.getElementById('topBar').innerHTML = MSB.pinkHeader({ title: 'Приглашение', back: true, showActions: false });

  const token = MSB.qsParam('token');
  const inv = token ? MSB.getInvite(token) : null;
  if (!inv) {
    document.querySelector('.frame').innerHTML += '<div style="text-align:center; padding:40px;">Приглашение не найдено</div>';
  } else {
    document.getElementById('empName').textContent = `${inv.firstName} ${inv.lastName}`;
    document.getElementById('empPhone').textContent = inv.phone;
    const exp = new Date(inv.expiresAt);
    const dd = String(exp.getDate()).padStart(2, '0');
    const mm = String(exp.getMonth() + 1).padStart(2, '0');
    const yy = exp.getFullYear();
    const hh = String(exp.getHours()).padStart(2, '0');
    const mi = String(exp.getMinutes()).padStart(2, '0');
    document.getElementById('empExpiry').textContent = `${dd}.${mm}.${yy} ${hh}:${mi}`;
    const link = `${location.origin}/screens/kyc-welcome.html?token=${inv.token}`;
    document.getElementById('linkText').textContent = link;

    document.getElementById('copyBtn').addEventListener('click', () => {
      if (navigator.clipboard) navigator.clipboard.writeText(link);
      MSB.toast('Ссылка скопирована');
    });
    window.preview = () => location.href = `kyc-welcome.html?token=${inv.token}`;
  }
</script>
</body>
</html>
