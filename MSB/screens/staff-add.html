<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=430, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Unired Business · Добавить кадр</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  body { background: #F0F0F0; }
  .frame {
    width: 430px;
    max-width: 100%;
    margin: 0 auto;
    min-height: 100vh;
    background: #F0F0F0;
    position: relative;
    padding-bottom: 110px;
  }

  .form-intro {
    padding: 16px 16px 4px;
    color: #54545B;
    font: 400 14px/1.5 'Manrope', sans-serif;
  }

  .form-list {
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .row-2 { display: flex; gap: 8px; }
  .row-2 .form-field { flex: 1; min-width: 0; }
  .form-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .form-field .lbl {
    font: 500 14px/1 'Manrope', sans-serif;
    color: #3F3F46;
    padding-left: 4px;
  }
  .form-field .input-group {
    background: #FFFFFF;
    height: 56px;
    border-radius: 16px;
    padding: 0 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1.5px solid transparent;
    transition: border-color .15s ease;
  }
  .form-field.invalid .input-group { border-color: #D2222D; }
  .form-field input,
  .form-field .passport-fixed {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font: 600 16px/1 'Manrope', sans-serif;
    color: #3F3F46;
    font-family: inherit;
    padding: 0;
    text-transform: none;
    min-width: 0;
  }
  .form-field input::placeholder { color: #A6A6A9; font-weight: 400; }
  .form-field .error-msg {
    font: 400 12px/1 'Manrope', sans-serif;
    color: #D2222D;
    padding-left: 4px;
    display: none;
  }
  .form-field.invalid .error-msg { display: block; }

  .passport-input-wrap {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .passport-input-wrap .series {
    width: 56px;
    text-transform: uppercase;
    text-align: center;
  }
  .passport-input-wrap .number {
    flex: 1;
  }
  .passport-input-wrap .sep {
    color: #A6A6A9;
    font: 400 16px/1 'Manrope', sans-serif;
  }

  .phone-prefix {
    color: #3F3F46;
    font: 600 16px/1 'Manrope', sans-serif;
    flex-shrink: 0;
  }

  .footer-cta {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 430px;
    padding: 0 16px;
    z-index: 30;
  }
  .cta-btn-pink {
    background: linear-gradient(171.83deg, #F93C65 23.888%, #E6303A 85.587%);
    color: #FFFFFF;
    border: none;
    height: 56px;
    border-radius: 16px;
    font: 600 16px/1 'Manrope', sans-serif;
    cursor: pointer;
    width: 100%;
    transition: filter .15s ease;
  }
  .cta-btn-pink[disabled] { opacity: .4; cursor: not-allowed; }
  .cta-btn-pink:active:not([disabled]) { filter: brightness(.93); }
</style>
</head>
<body>
<div class="frame">
  <div id="topBar"></div>

  <div class="form-intro">
    Заполните данные нового сотрудника. После отправки на его номер придёт ссылка на прохождение KYC через MyID.
  </div>

  <div class="form-list">
    <div class="row-2">
      <div class="form-field" data-field="firstName">
        <label class="lbl" for="firstName">Имя</label>
        <div class="input-group">
          <input id="firstName" type="text" placeholder="Алишер" autocomplete="off">
        </div>
        <div class="error-msg">Введите имя</div>
      </div>
      <div class="form-field" data-field="lastName">
        <label class="lbl" for="lastName">Фамилия</label>
        <div class="input-group">
          <input id="lastName" type="text" placeholder="Каримов" autocomplete="off">
        </div>
        <div class="error-msg">Введите фамилию</div>
      </div>
    </div>

    <div class="form-field" data-field="passport">
      <label class="lbl" for="passportSeries">Серия и номер паспорта</label>
      <div class="input-group">
        <div class="passport-input-wrap" style="flex:1;">
          <input id="passportSeries" class="series" type="text" maxlength="2" placeholder="AA" autocomplete="off" inputmode="text">
          <span class="sep">·</span>
          <input id="passportNumber" class="number" type="text" maxlength="7" placeholder="1234567" autocomplete="off" inputmode="numeric">
        </div>
      </div>
      <div class="error-msg">Формат: 2 буквы + 7 цифр (AA1234567)</div>
    </div>

    <div class="form-field" data-field="dob">
      <label class="lbl" for="dob">Дата рождения</label>
      <div class="input-group">
        <input id="dob" type="text" placeholder="01.01.1990" maxlength="10" inputmode="numeric" autocomplete="off">
        <button class="cal-btn" style="background:none; border:none; padding:0; cursor:pointer;">
          <img src="../assets/ic-calendar.svg" alt="" style="width:24px; height:24px; opacity:.5;">
        </button>
      </div>
      <div class="error-msg">Формат: ДД.ММ.ГГГГ</div>
    </div>

    <div class="form-field" data-field="phone">
      <label class="lbl" for="phone">Номер телефона</label>
      <div class="input-group">
        <span class="phone-prefix">+998</span>
        <input id="phone" type="tel" placeholder="90 123 45 67" maxlength="13" autocomplete="off" inputmode="tel">
      </div>
      <div class="error-msg">Введите 9 цифр номера</div>
    </div>
  </div>

  <div class="footer-cta">
    <button class="cta-btn-pink" id="sendBtn" type="button">Отправить приглашение</button>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
  MSB.init();
  document.getElementById('topBar').innerHTML = MSB.pinkHeader({ title: 'Добавить кадр', back: true, showActions: false });

  const firstName = document.getElementById('firstName');
  const lastName = document.getElementById('lastName');
  const passportSeries = document.getElementById('passportSeries');
  const passportNumber = document.getElementById('passportNumber');
  const dob = document.getElementById('dob');
  const phone = document.getElementById('phone');
  const sendBtn = document.getElementById('sendBtn');

  // Auto-uppercase passport series
  passportSeries.addEventListener('input', e => {
    e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 2);
    if (e.target.value.length === 2) passportNumber.focus();
  });
  // Numeric-only for passport number
  passportNumber.addEventListener('input', e => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 7);
  });

  // Auto-format DOB as DD.MM.YYYY
  dob.addEventListener('input', e => {
    let v = e.target.value.replace(/\D/g, '').slice(0, 8);
    if (v.length > 4) v = v.slice(0, 2) + '.' + v.slice(2, 4) + '.' + v.slice(4);
    else if (v.length > 2) v = v.slice(0, 2) + '.' + v.slice(2);
    e.target.value = v;
  });

  // Auto-format phone with spaces
  phone.addEventListener('input', e => {
    let v = e.target.value.replace(/\D/g, '').slice(0, 9);
    let formatted = '';
    if (v.length > 0) formatted = v.slice(0, 2);
    if (v.length > 2) formatted += ' ' + v.slice(2, 5);
    if (v.length > 5) formatted += ' ' + v.slice(5, 7);
    if (v.length > 7) formatted += ' ' + v.slice(7, 9);
    e.target.value = formatted;
  });

  function setInvalid(name, invalid) {
    document.querySelector(`[data-field="${name}"]`).classList.toggle('invalid', invalid);
  }

  function validate() {
    const passport = (passportSeries.value + passportNumber.value).toUpperCase();
    const checks = {
      firstName: firstName.value.trim().length >= 2,
      lastName:  lastName.value.trim().length >= 2,
      passport:  MSB.validatePassport(passport),
      dob:       MSB.validateDob(dob.value),
      phone:     MSB.validatePhone('+998' + phone.value.replace(/\D/g, '')),
    };
    return checks;
  }

  function updateButton() {
    const c = validate();
    const allValid = Object.values(c).every(Boolean);
    sendBtn.disabled = !allValid;
  }

  [firstName, lastName, passportSeries, passportNumber, dob, phone].forEach(el => {
    el.addEventListener('input', updateButton);
  });
  updateButton();

  sendBtn.addEventListener('click', () => {
    const c = validate();
    Object.entries(c).forEach(([k, v]) => setInvalid(k, !v));
    if (!Object.values(c).every(Boolean)) return;

    const invite = MSB.createInvite({
      firstName: firstName.value.trim(),
      lastName: lastName.value.trim(),
      passport: (passportSeries.value + passportNumber.value).toUpperCase(),
      dob: dob.value,
      phone: '+998' + phone.value.replace(/\D/g, ''),
    });
    location.href = 'staff-invite-sent.html?token=' + invite.token;
  });
</script>
</body>
</html>
