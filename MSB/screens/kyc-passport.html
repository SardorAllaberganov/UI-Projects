<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=430, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MyID · Паспортные данные</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  body { background: #F0F0F0; }
  .frame {
    width: 430px;
    max-width: 100%;
    margin: 0 auto;
    min-height: 100vh;
    background: #F0F0F0;
    position: relative;
    padding-bottom: 110px;
  }

  .form-intro {
    padding: 8px 16px 4px;
  }
  .form-intro .title {
    font: 700 22px/1.3 'Manrope', sans-serif;
    color: #3F3F46;
    margin-bottom: 6px;
  }
  .form-intro .sub {
    font: 400 14px/1.5 'Manrope', sans-serif;
    color: #54545B;
  }

  .form-list {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .form-field { display: flex; flex-direction: column; gap: 6px; }
  .form-field .lbl {
    font: 500 14px/1 'Manrope', sans-serif;
    color: #3F3F46;
    padding-left: 4px;
  }
  .form-field .input-group {
    background: #FFFFFF;
    height: 56px;
    border-radius: 16px;
    padding: 0 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1.5px solid transparent;
    transition: border-color .15s ease;
  }
  .form-field.invalid .input-group { border-color: #D2222D; }
  .form-field input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font: 600 16px/1 'Manrope', sans-serif;
    color: #3F3F46;
    font-family: inherit;
    padding: 0;
    min-width: 0;
  }
  .form-field input::placeholder { color: #A6A6A9; font-weight: 400; }
  .form-field .error-msg {
    font: 400 12px/1 'Manrope', sans-serif;
    color: #D2222D;
    padding-left: 4px;
    display: none;
  }
  .form-field.invalid .error-msg { display: block; }

  .passport-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
  }
  .passport-wrap .series {
    width: 56px;
    text-align: center;
    text-transform: uppercase;
  }
  .passport-wrap .sep {
    color: #DFDFE4;
    font-size: 18px;
  }
  .passport-wrap .number { flex: 1; }

  .footer-cta {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 430px;
    padding: 0 16px;
    z-index: 30;
  }
  .cta-btn-pink {
    background: linear-gradient(171.83deg, #F93C65 23.888%, #E6303A 85.587%);
    color: #FFFFFF;
    border: none;
    height: 56px;
    border-radius: 16px;
    font: 600 16px/1 'Manrope', sans-serif;
    cursor: pointer;
    width: 100%;
  }
  .cta-btn-pink[disabled] { opacity: .4; cursor: not-allowed; }
</style>
</head>
<body>
<div class="frame">
  <div id="topBar"></div>

  <div class="kyc-steps">
    <div class="kyc-step-bar done"></div>
    <div class="kyc-step-bar"></div>
    <div class="kyc-step-bar"></div>
  </div>
  <div class="kyc-step-label"><span class="current">Шаг 1 из 3</span> · Паспорт</div>

  <div class="form-intro">
    <div class="title">Введите паспортные данные</div>
    <div class="sub">Это нужно для проверки личности через сервис MyID. Данные будут сверены с государственной базой.</div>
  </div>

  <div class="form-list">
    <div class="form-field" data-field="passport">
      <label class="lbl">Серия и номер паспорта</label>
      <div class="input-group">
        <div class="passport-wrap">
          <input id="series" class="series" type="text" maxlength="2" placeholder="AA" autocomplete="off">
          <span class="sep">•</span>
          <input id="number" class="number" type="text" maxlength="7" placeholder="1234567" autocomplete="off" inputmode="numeric">
        </div>
      </div>
      <div class="error-msg">Серия 2 буквы + номер 7 цифр</div>
    </div>

    <div class="form-field" data-field="dob">
      <label class="lbl">Дата рождения</label>
      <div class="input-group">
        <input id="dob" type="text" placeholder="ДД.ММ.ГГГГ" maxlength="10" inputmode="numeric" autocomplete="off">
        <button class="cal-btn" style="background:none; border:none; padding:0; cursor:pointer;">
          <img src="../assets/ic-calendar.svg" alt="" style="width:24px; height:24px; opacity:.5;">
        </button>
      </div>
      <div class="error-msg">Введите дату в формате ДД.ММ.ГГГГ</div>
    </div>
  </div>

  <div class="footer-cta">
    <button class="cta-btn-pink" id="nextBtn">Продолжить</button>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
  const token = MSB.qsParam('token');
  const inv = token ? MSB.getInvite(token) : null;
  if (!inv) location.replace('kyc-welcome.html');

  document.getElementById('topBar').innerHTML = MSB.pinkHeader({ title: 'Подтверждение личности', back: true, showActions: false });

  const series = document.getElementById('series');
  const number = document.getElementById('number');
  const dob = document.getElementById('dob');
  const nextBtn = document.getElementById('nextBtn');

  series.addEventListener('input', e => {
    e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 2);
    if (e.target.value.length === 2) number.focus();
  });
  number.addEventListener('input', e => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 7);
  });
  dob.addEventListener('input', e => {
    let v = e.target.value.replace(/\D/g, '').slice(0, 8);
    if (v.length > 4) v = v.slice(0, 2) + '.' + v.slice(2, 4) + '.' + v.slice(4);
    else if (v.length > 2) v = v.slice(0, 2) + '.' + v.slice(2);
    e.target.value = v;
  });

  function validate() {
    return {
      passport: MSB.validatePassport(series.value + number.value),
      dob:      MSB.validateDob(dob.value),
    };
  }
  function updateBtn() {
    nextBtn.disabled = !Object.values(validate()).every(Boolean);
  }
  [series, number, dob].forEach(el => el.addEventListener('input', updateBtn));
  updateBtn();

  nextBtn.addEventListener('click', () => {
    const c = validate();
    Object.entries(c).forEach(([k, v]) => {
      document.querySelector(`[data-field="${k}"]`).classList.toggle('invalid', !v);
    });
    if (!Object.values(c).every(Boolean)) return;

    // Verify against invite data
    const passport = series.value + number.value;
    if (passport.toUpperCase() !== inv.passport.toUpperCase() || dob.value !== inv.dob) {
      MSB.toast('Данные не совпадают с приглашением');
      return;
    }
    location.href = 'kyc-faceid.html?token=' + token;
  });
</script>
</body>
</html>
