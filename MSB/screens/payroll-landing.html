<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=430, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Unired Business · Зарплата</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  body { background: #F0F0F0; }
  .frame {
    width: 430px;
    max-width: 100%;
    margin: 0 auto;
    min-height: 100vh;
    background: #F0F0F0;
    position: relative;
  }

  .system-list {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .system-row {
    background: #FFFFFF;
    border-radius: 16px;
    padding: 14px 16px;
    min-height: 64px;
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
    color: inherit;
    border: none;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    width: 100%;
    position: relative;
    overflow: hidden;
    transition: transform .12s ease;
  }
  .system-row:active { transform: scale(.99); }
  .system-row.disabled {
    background: #E7E9EC;
    cursor: not-allowed;
    pointer-events: none;
  }
  .system-row .logo-box {
    width: 44px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .system-row .logo-box img { max-width: 100%; max-height: 100%; }
  .system-row .name {
    flex: 1;
    font: 600 16px/1.2 'Manrope', sans-serif;
    color: #3F3F46;
  }
  .system-row.disabled .name { color: #A1A1AA; }
  .system-row .chev {
    width: 20px;
    height: 20px;
    color: #A1A1AA;
    flex-shrink: 0;
  }

  .skoro-ribbon {
    position: absolute;
    top: 8px;
    right: -28px;
    width: 110px;
    height: 22px;
    background: linear-gradient(166.4deg, #F93C65 23.888%, #E6303A 85.587%);
    transform: rotate(45deg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    pointer-events: none;
  }
  .skoro-ribbon span {
    font: 600 12px/1 'Manrope', sans-serif;
    color: #FFFFFF;
  }

  /* Inline SVG logo containers */
  .visa-logo {
    color: #1A1F71;
    font: 800 14px/1 Arial, sans-serif;
    letter-spacing: -0.5px;
  }
  .uzcard-logo {
    color: #0066CC;
    font: 800 18px/1 Arial, sans-serif;
  }
  .humo-logo {
    color: #C9A227;
    font: 800 18px/1 Arial, sans-serif;
  }
</style>
</head>
<body>
<div class="frame">
  <div id="topBar"></div>

  <div class="system-list">
    <a class="system-row" href="payroll-contracts.html">
      <div class="logo-box visa-logo">
        <svg viewBox="0 0 48 16" fill="none" width="44" height="16">
          <path d="M19.5 0L16.2 16H12.6L15.9 0H19.5Z" fill="#1A1F71"/>
          <path d="M31.5 0.3C30.6 0.1 29.4 0 28 0C24.1 0 21.5 1.9 21.4 4.6C21.3 6.6 23.4 7.7 25 8.4C26.7 9.1 27.2 9.6 27.2 10.2C27.1 11.2 25.9 11.6 24.7 11.6C23 11.6 22.1 11.4 20.7 10.9L20.1 10.6L19.5 14.7C20.4 15.1 22.2 15.4 24 15.4C28.2 15.4 30.7 13.5 30.8 10.6C30.9 9 29.9 7.7 27.8 6.6C26.5 5.9 25.8 5.5 25.8 4.8C25.8 4.2 26.5 3.6 28 3.6C29.3 3.6 30.2 3.9 30.9 4.2L31.3 4.4L31.5 0.3Z" fill="#1A1F71"/>
          <path d="M37.6 0H40.5C41.4 0 42 0.3 42.3 1.2L45.5 16H42L41.5 13.5H37.1L36.4 16H32.8L37.6 0.3C38 0.3 37.6 0 37.6 0ZM38.5 9.9H41C41 9.9 40.1 5.4 40 5C39.8 4.5 39.7 3.9 39.6 3.5C39.5 3.9 39.3 4.7 39.2 5C39.1 5.4 38.5 9.9 38.5 9.9Z" fill="#1A1F71"/>
          <path d="M11 0L7.6 11L7.2 9C6.5 6.5 4.4 3.9 2 2.5L5.2 16H8.9L13.7 0H11Z" fill="#1A1F71"/>
          <path d="M3.4 0H0L0 0.3C2.7 1 5.7 3.6 6.7 6.5L5.4 1.2C5.2 0.3 4.5 0 3.4 0Z" fill="#F7B600"/>
        </svg>
      </div>
      <div class="name">Visa</div>
      <div class="chev">
        <svg viewBox="0 0 16 16" fill="none" width="16" height="16"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </a>

    <button class="system-row disabled" type="button">
      <div class="logo-box uzcard-logo">
        <svg viewBox="0 0 48 28" fill="none" width="44" height="26">
          <circle cx="24" cy="14" r="13" fill="#0066CC"/>
          <path d="M16 9v8a4 4 0 008 0V9" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/>
          <text x="36" y="20" font-family="Arial" font-size="9" font-weight="700" fill="#0066CC">card</text>
        </svg>
      </div>
      <div class="name">Uzcard</div>
      <div class="skoro-ribbon"><span>Скоро</span></div>
    </button>

    <button class="system-row disabled" type="button">
      <div class="logo-box humo-logo">
        <svg viewBox="0 0 48 28" fill="none" width="44" height="26">
          <path d="M8 24V6c0-1.5 1-3 3-3s3 1.5 3 3v18" stroke="#C9A227" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <path d="M20 24V6c0-1.5 1-3 3-3s3 1.5 3 3v18" stroke="#C9A227" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <circle cx="36" cy="14" r="8" stroke="#C9A227" stroke-width="2.5" fill="none"/>
        </svg>
      </div>
      <div class="name">Humo</div>
      <div class="skoro-ribbon"><span>Скоро</span></div>
    </button>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
  MSB.init();
  document.getElementById('topBar').innerHTML = MSB.pinkHeader({ title: 'Зарплата', back: true, showActions: false });
</script>
</body>
</html>
